<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireninja</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Masonry + imagesLoaded must load before script.js — no defer, order matters -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/masonry/4.2.2/masonry.pkgd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.imagesloaded/4.1.4/imagesloaded.pkgd.min.js"></script>
    <!-- umami stats (detailed, but blocked for a meaningful share of visitors by ad blockers) -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="0e122230-1e6a-4b71-8d8a-0a8080d4c134"></script>
    <!-- backup visit counter, see analytics.js for why this exists -->
    <script src="analytics.js" defer></script>
    <!-- Custom Stylesheet & Script -->
    <link href="styles.css" rel="stylesheet">
    <!-- images.js defines rendersDatabase, must come before script.js -->
    <script src="images.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">

        <header class="profile-header">
            <div class="profile-info-block">
                <div class="avatar-container">
                    <div class="avatar-outline"></div>
                    <img id="profile-pic" class="avatar-pic" src="https://ik.imagekit.io/fireninja/download.gif" alt="Fireninja" onerror="this.src='https://placehold.co/150x150/0f172a/f97316?text=F'">
                </div>

                <div class="profile-text">
                    <div class="profile-name-row">
                        <h1 class="display-title" id="display-name">Fireninja</h1>
                        <i class="fa-solid fa-fire-flame-curved verified-star" title="Hobbyist Render Artist"></i>
                        <div class="discord-copy-pill" onclick="copyDiscordName()" title="Copy Discord handle">
                            <i class="fa-brands fa-discord"></i>
                            <span id="discord-tag-display">fireninja_</span>
                            <i class="fa-regular fa-copy" style="opacity: 0.6; font-size: 0.7rem;"></i>
                        </div>
                    </div>
                    <p class="casual-bio">
                        Casual 3D artist.<br>
                        I also like to read books.
                    </p>
                </div>
            </div>

            <!-- External widget from discord.c99.nl — shows live presence/status -->
            <div class="discord-widget-container">
                <img class="discord-widget-img" src="https://discord.c99.nl/widget/theme-2/622767048224931843.png" alt="Discord Status" onerror="this.style.display='none'">
            </div>
        </header>

        <!-- Populated by bootstrapLinks() from linksDatabase in script.js -->
        <nav class="links-grid" id="links-container"></nav>

        <main class="gallery-section">
            <header class="gallery-header">
                <h2 class="gallery-title">Renders Gallery</h2>
                <span class="gallery-counter" id="gallery-count">0 Projects</span>
            </header>

            <!-- Populated by bootstrapGallery() from rendersDatabase in images.js -->
            <div class="gallery-masonry" id="gallery-container"></div>
        </main>

    </div>

    <!-- Clicking the backdrop dismisses; stopPropagation on the window prevents that when clicking inside -->
    <div class="lightbox" id="viewer-lightbox" onclick="dismissLightbox()">
        <div class="lightbox-window" onclick="event.stopPropagation()">

            <button class="lightbox-close-btn" onclick="dismissLightbox()">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="lightbox-viewport">
                <!-- For video entries this gets hidden and a <video> is injected before it at runtime -->
                <img class="lightbox-active-img" id="lightbox-main-img" src="" alt="Active View">
            </div>

            <div class="lightbox-deck">
                <div class="deck-header">
                    <h3 class="deck-title" id="lightbox-title"></h3>
                    <p class="deck-desc" id="lightbox-desc"></p>

                    <div class="variation-wrap" id="variations-wrapper">
                        <span class="variation-header">Project Variations</span>
                        <div class="variation-grid" id="variations-container"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Briefly shown after copying Discord username, auto-hides after 2.5s -->
    <div class="toast-msg" id="alert-toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-text-box">Discord Username Copied!</span>
    </div>
</body>
</html>
